name: CI

# Build verification + headless test execution. surf_scaf is the
# canonical bundled extension — it statically links snore_core,
# scaffolder, and surfacer into a single shared library (Godot 4
# GDExtension can't resolve classes across .so boundaries; see
# CLAUDE.md). Because every framework's tests are statically
# compiled INTO the surf_scaf bundle (sc_tests=yes), running this
# workflow's demo through a headless Godot executes the full test
# suite for snore_core + scaffolder + surfacer at once. The other
# framework repos' CIs only verify compilation; surf_scaf's CI is
# where actual runtime tests happen.

on:
  # Cost-conscious trigger set (matches hopnbop_private's pattern):
  # active dev work pushes to `dev` and does NOT trigger CI; the
  # daily schedule + integration pushes to the slim default branches
  # do.
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 4 * * *'  # 04:00 UTC daily
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build bundle (Linux, x86_64, debug)
    runs-on: ubuntu-latest
    env:
      # Opt actions/checkout@v4 (and other Node-20-based actions)
      # into Node 24 ahead of the June 2026 forced switch.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout surf_scaf
        uses: actions/checkout@v4
        with:
          path: surf_scaf

      - name: Checkout snore_core (private)
        uses: actions/checkout@v4
        with:
          repository: SnoringCatGames/snore_core
          ref: dev
          token: ${{ secrets.PRIVATECHECKOUTACCESSTOKEN }}
          path: snore_core

      - name: Checkout scaffolder
        uses: actions/checkout@v4
        with:
          repository: SnoringCatGames/scaffolder
          ref: dev
          path: scaffolder

      - name: Checkout surfacer
        uses: actions/checkout@v4
        with:
          repository: SnoringCatGames/surfacer
          ref: dev
          path: surfacer

      - name: Checkout godot-cpp (4.4)
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          ref: '4.4'
          path: godot-cpp

      - name: Checkout googletest
        uses: actions/checkout@v4
        with:
          repository: google/googletest
          path: googletest

      - name: Compute cache key inputs
        id: cache_inputs
        run: |
          echo "godot_cpp_sha=$(git -C godot-cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "gcc_version=$(gcc -dumpversion)" >> "$GITHUB_OUTPUT"

      - name: Cache SCons compiled objects
        # godot-cpp's SConstruct calls env.CacheDir($SCONS_CACHE) when
        # the env var is set, giving content-addressed (MD5) caching of
        # every compile output. Same env carries over to the framework
        # build, so framework objects get cached too. See snore_core's
        # ci.yml for the full design rationale.
        uses: actions/cache@v4
        with:
          path: .scons-cache
          key: scons-v3-${{ runner.os }}-gcc${{ steps.cache_inputs.outputs.gcc_version }}-${{ steps.cache_inputs.outputs.godot_cpp_sha }}-${{ github.sha }}
          restore-keys: |
            scons-v3-${{ runner.os }}-gcc${{ steps.cache_inputs.outputs.gcc_version }}-${{ steps.cache_inputs.outputs.godot_cpp_sha }}-
            scons-v3-${{ runner.os }}-gcc${{ steps.cache_inputs.outputs.gcc_version }}-
            scons-v3-${{ runner.os }}-

      - name: Install SCons
        run: |
          python3 -m pip install --upgrade pip
          pip3 install scons

      - name: Build surf_scaf bundle (CI mode, dev features + tests)
        working-directory: surf_scaf
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: scons sc_ci=yes sc_dev=yes sc_tests=yes

      - name: Verify artifact landed in addon/bin
        working-directory: surf_scaf
        run: |
          set -e
          ls -lR addon/bin/
          find addon/bin -name 'libSurfScaf.*.so' -o -name 'libSurfScaf.*.dylib' \
              | grep -q . || (echo 'No shared library produced.'; exit 1)

      - name: Cache Godot binary
        id: cache-godot
        # 4.4-stable is the runtime that matches godot-cpp 4.4 (which
        # the extension is built against). Pinning the version to make
        # cache invalidation explicit — bump GODOT_VERSION when moving.
        uses: actions/cache@v4
        with:
          path: godot-bin
          key: godot-4.4-stable-linux-x86_64-v1

      - name: Download Godot 4.4 stable
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p godot-bin
          curl -sL -o godot.zip \
              "https://github.com/godotengine/godot-builds/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip"
          unzip -q godot.zip -d godot-bin/
          mv godot-bin/Godot_v4.4-stable_linux.x86_64 godot-bin/godot
          chmod +x godot-bin/godot
          rm godot.zip

      - name: Run demo headless + check tests
        working-directory: surf_scaf
        # The demo project's DemoMain._ready() calls SnoreCore.run_tests()
        # by default (run_tests = true). gtest runs all linked-in test
        # suites and prints either "SnoreCore test result: ALL TESTS
        # PASSED!" or "...SOME TESTS FAILED!" to stdout. We grep for the
        # passed marker and fail CI if it's absent.
        #
        # --headless: no graphics. --quit: exit after first main-loop
        #     iteration (which is after _ready() completes). --verbose:
        #     extra diagnostics if anything blows up.
        # set +e around the godot invocation: Godot sometimes exits
        #     non-zero on warning-level messages even after a successful
        #     test run, so we don't trust the exit code — the stdout
        #     marker is authoritative.
        run: |
          set +e
          ../godot-bin/godot --verbose --headless --quit \
              --path ./demo 2>&1 | tee test_output.txt
          set -e
          if grep -q "ALL TESTS PASSED" test_output.txt; then
            echo "Tests passed."
          else
            echo "::error::'ALL TESTS PASSED' not found in test output."
            echo "Last 100 lines of output:"
            tail -100 test_output.txt
            exit 1
          fi
